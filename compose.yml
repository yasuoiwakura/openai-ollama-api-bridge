services:
  # Legacy bridge (existing)
  ollama-bridge:
    image: ghcr.io/yasuoiwakura/openai-ollama-api-bridge:${IMAGE_TAG:-latest}
    build: .
    container_name: py-ollama-openai-bridge
    restart: unless-stopped
    env_file: .env
    environment:
      # Pause zwischen Ende eines Upstream-Requests und Start des nächsten (Sekunden)
      # Fester Wert via compose, override via .env UPSTREAM_PAUSE
      - UPSTREAM_PAUSE=${UPSTREAM_PAUSE:-1.5}
      - UPSTREAM_LOW_TPS=${UPSTREAM_LOW_TPS:-1.0}
    ports:
      - "${LISTEN_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; exit(0 if urllib.request.urlopen('http://localhost:8080/health').status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

